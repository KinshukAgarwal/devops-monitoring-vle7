# kube-prometheus-stack trimmed for a 2 GB t3.small running k3s.
# k3s runs scheduler/controller-manager/proxy/etcd inside one process, so those scrape jobs and rules are off.
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false
    kubeApiserverAvailability: false   # heavy SLO recording rules
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
kubeEtcd: {enabled: false}
# API-server metrics are ~half of all series on a small cluster; dropped to fit in 2 GB
kubeApiServer: {enabled: false}
kubelet:
  serviceMonitor: {probes: false, resource: false}

prometheusOperator:
  admissionWebhooks: {enabled: false}
  tls: {enabled: false}
  resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 128Mi}}

prometheus:
  prometheusSpec:
    retention: 6h
    scrapeInterval: 30s
    evaluationInterval: 30s
    ruleSelectorNilUsesHelmValues: false          # pick up our own PrometheusRule objects
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources: {requests: {cpu: 100m, memory: 200Mi}, limits: {memory: 512Mi}}

alertmanager:
  alertmanagerSpec:
    resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 96Mi}}
  config:
    global: {resolve_timeout: 5m}
    route:
      receiver: webhook-logger
      group_by: [alertname, namespace]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      routes:
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
    receivers:
      - name: "null"
      - name: webhook-logger
        webhook_configs:
          - url: http://alert-webhook.monitoring.svc:8080/alert
            send_resolved: true
      # Email / Slack would be added the same way, e.g.
      # - name: team-email
      #   email_configs: [{to: oncall@example.com, from: alertmanager@example.com, smarthost: smtp.example.com:587, auth_username: ..., auth_password: ...}]
      # - name: team-slack
      #   slack_configs: [{api_url: https://hooks.slack.com/services/..., channel: '#alerts'}]
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity = warning']
        equal: [alertname, namespace]

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser
  resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 256Mi}}
  # No python sidecars (~80 MB each): datasources are static and the 4 dashboards we use are
  # mounted straight from the ConfigMaps the chart creates.
  sidecar:
    datasources: {enabled: false}
    dashboards: {enabled: false}
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - {name: nodes,   folder: Kubernetes, type: file, options: {path: /var/lib/grafana/dashboards/nodes}}
        - {name: cluster, folder: Kubernetes, type: file, options: {path: /var/lib/grafana/dashboards/cluster}}
        - {name: nspods,  folder: Kubernetes, type: file, options: {path: /var/lib/grafana/dashboards/nspods}}
        - {name: pod,     folder: Kubernetes, type: file, options: {path: /var/lib/grafana/dashboards/pod}}
  dashboardsConfigMaps:
    nodes: monitoring-kube-prometheus-nodes                        # Node Exporter / Nodes
    cluster: monitoring-kube-prometheus-k8s-resources-cluster      # Compute Resources / Cluster
    nspods: monitoring-kube-prometheus-k8s-resources-namespace     # Compute Resources / Namespace (Pods)
    pod: monitoring-kube-prometheus-k8s-resources-pod              # Compute Resources / Pod
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - {name: Prometheus, type: prometheus, uid: prometheus, isDefault: true,
           url: "http://monitoring-kube-prometheus-prometheus.monitoring:9090/"}
        - {name: Alertmanager, type: alertmanager, uid: alertmanager,
           url: "http://monitoring-kube-prometheus-alertmanager.monitoring:9093/",
           jsonData: {implementation: prometheus}}
  env:
    GOMEMLIMIT: 150MiB

# generous probes: on a swapping 2 GB node a 1 s probe timeout restarts healthy pods
kube-state-metrics:
  resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 96Mi}}
  livenessProbe: {timeoutSeconds: 10, failureThreshold: 6}
  readinessProbe: {timeoutSeconds: 10}
prometheus-node-exporter:
  resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
  livenessProbe: {timeoutSeconds: 10, failureThreshold: 6}
  readinessProbe: {timeoutSeconds: 10}
