# Deliberately broken pod: exits with code 1 after 5 s -> CrashLoopBackOff -> PodCrashLoop alert
apiVersion: v1
kind: Pod
metadata:
  name: crash-demo
  labels: {app: crash-demo}
spec:
  containers:
  - name: crash
    image: busybox:1.37
    command: ["sh", "-c", "echo 'crash-demo: starting'; sleep 5; echo 'crash-demo: fatal error'; exit 1"]
    resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 16Mi}}
