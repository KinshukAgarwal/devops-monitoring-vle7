apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vle7-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: k8s-alerts
    rules:
    - alert: PodCrashLoop                       # rule from the lab handout
      expr: kube_pod_container_status_restarts_total > 3
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value }} times"
    - alert: HighCPUUsage
      expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ $labels.instance }} CPU above 80% ({{ $value | printf \"%.0f\" }}%)"
    - alert: NodeDown
      expr: up{job="node-exporter"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Node exporter {{ $labels.instance }} is unreachable"
