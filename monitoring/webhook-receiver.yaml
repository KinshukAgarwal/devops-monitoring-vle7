# In-cluster Alertmanager webhook receiver: logs every alert it receives (stand-in for email/Slack).
apiVersion: v1
kind: ConfigMap
metadata: {name: alert-webhook, namespace: monitoring}
data:
  server.py: |
    import json, datetime, http.server
    class H(http.server.BaseHTTPRequestHandler):
        def do_POST(self):
            msg = json.loads(self.rfile.read(int(self.headers['Content-Length'])))
            for a in msg['alerts']:
                l, ann = a['labels'], a['annotations']
                print(f"{datetime.datetime.now():%H:%M:%S} [{a['status'].upper()}] {l.get('alertname')} "
                      f"severity={l.get('severity')} pod={l.get('pod', '-')} :: {ann.get('summary', ann.get('description', ''))[:110]}", flush=True)
            self.send_response(200); self.end_headers()
        def log_message(self, *args): pass
    print("alert-webhook listening on :8080", flush=True)
    http.server.HTTPServer(('', 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alert-webhook, namespace: monitoring}
spec:
  replicas: 1
  selector: {matchLabels: {app: alert-webhook}}
  template:
    metadata: {labels: {app: alert-webhook}}
    spec:
      containers:
      - name: receiver
        image: python:3.13-alpine
        command: ["python", "-u", "/app/server.py"]
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {memory: 48Mi}}
        volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: alert-webhook}}]
---
apiVersion: v1
kind: Service
metadata: {name: alert-webhook, namespace: monitoring}
spec:
  selector: {app: alert-webhook}
  ports: [{port: 8080, targetPort: 8080}]
